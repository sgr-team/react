services:
  books-postgres:
    container_name: "books-postgres"
    hostname: books-postgres
    image: postgres:16.4-bookworm
    restart: no
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=main
    volumes:
      - ./.local-data/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 5s
      timeout: 1s
      retries: 20
      start_period: 5s
